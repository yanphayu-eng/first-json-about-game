<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Cards</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        width: 100%;
        min-height: 100vh;
      }

      body::-webkit-scrollbar {
        display: none;
      }

      .container {
        width: 100%;
        padding: 20px 100px;
        display: grid;
        gap: 25px;
        grid-template-columns: repeat(4, 1fr);
      }

      @media (max-width: 1024px) {
        .container {
          grid-template-columns: repeat(3, 1fr);
          padding: 20px 50px;
        }
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: repeat(2, 1fr);
          padding: 20px;
        }
      }

      @media (max-width: 480px) {
        .container {
          grid-template-columns: repeat(1, 1fr);
          padding: 10px;
        }
      }

      .card {
        width: 100%;
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        cursor: pointer;
      }

      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card .info {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        color: white;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;

        opacity: 0;
        transition: 0.3s ease;
        text-align: center;
        padding: 10px;
      }

      .card:hover .info {
        opacity: 1;
      }

      .card.active .info {
        opacity: 1;
      }

      .card .info h3 {
        font-size: 1.5rem;
      }
    </style>
  </head>

  <body>
    <div class="container" id="container"></div>

    <script>
      // load data
      fetch("https://yanphayu-eng.github.io/first-json-about-game/index.json")
        .then((res) => res.json())
        .then((data) => {
          let show = "";

          data.forEach((item) => {
            show += `
                    <div class="card">
                        <img src="${item.image}">
                        <div class="info">
                        <h3>${item.name}</h3>
                        <p>${item.description}</p>
                        </div>
                    </div>
                    `;
          });

          document.getElementById("container").innerHTML = show;
        });

      document.addEventListener("click", function (e) {
        const card = e.target.closest(".card");

        if (!card) return;

        document.querySelectorAll(".card").forEach((c) => {
          if (c !== card) c.classList.remove("active");
        });

        card.classList.toggle("active");
      });
    </script>
  </body>
</html>
